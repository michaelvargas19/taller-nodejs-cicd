<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>__REPORT_TITLE__</title>
  <style>
    :root {
      --bg1: #f5f7fa;
      --bg2: #e4ecf4;
      --surface: #ffffff;
      --ink: #0b1f35;
      --muted: #4c6075;
      --accent: #0a84ff;
      --ok: #1f8f55;
      --ring: rgba(10, 132, 255, 0.24);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 10%, #ffffff 0%, transparent 42%),
        radial-gradient(circle at 90% 90%, #d8e8f8 0%, transparent 40%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(860px, 100%);
      background: var(--surface);
      border-radius: 18px;
      box-shadow: 0 16px 45px rgba(16, 36, 63, 0.14);
      border: 1px solid #d7e1eb;
      overflow: hidden;
    }

    .hero {
      padding: 28px 30px;
      background: linear-gradient(120deg, #0b2d57, #114f9f 52%, #0a84ff);
      color: #ffffff;
    }

    .hero h1 {
      margin: 0 0 8px;
      line-height: 1.2;
      font-size: clamp(1.4rem, 3vw, 2rem);
      letter-spacing: 0.3px;
    }

    .hero p {
      margin: 0;
      color: rgba(255, 255, 255, 0.9);
    }

    .content {
      padding: 24px 30px 30px;
      display: grid;
      gap: 14px;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .chip {
      border: 1px solid #d0deed;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.9rem;
      color: var(--muted);
      background: #f6faff;
    }

    .chip strong {
      color: var(--ink);
    }

    .ok {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--ok);
      font-weight: 600;
      margin-top: 6px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 0 6px rgba(31, 143, 85, 0.15);
    }

    .footer {
      margin-top: 8px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      .hero,
      .content {
        padding: 18px;
      }
    }
  </style>
</head>
<body>
  <main class="card" role="main" aria-label="Reporte de pipeline">
    <header class="hero">
      <h1>__REPORT_TITLE__</h1>
      <p>Reporte generado automaticamente por Azure Pipelines.</p>
    </header>

    <section class="content">
      <div class="row">
        <span class="chip"><strong>App:</strong> __APP_NAME__</span>
        <span class="chip"><strong>Build:</strong> __BUILD_NUMBER__</span>
        <span class="chip"><strong>Rama:</strong> __BRANCH__</span>
      </div>

      <div class="row">
        <span class="chip"><strong>Commit:</strong> __COMMIT__</span>
      </div>

      <div class="ok">
        <span class="dot"></span>
        Reporte listo para publicacion en artefactos
      </div>

      <p class="footer">Edita el titulo en la variable <strong>reportTitle</strong> del pipeline o en esta plantilla HTML.</p>
    </section>
  </main>
</body>
</html>
