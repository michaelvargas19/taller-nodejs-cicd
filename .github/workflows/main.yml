name: CI/CD Node.js

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "18.x"
  APP_NAME: "taller-nodejs-app"
  DEFAULT_REPORT_TITLE: "Reporte de ejecucion CI/CD"

jobs:
  build:
    name: CI Generate artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build app
        run: npm run build --if-present

      - name: Load report title from file
        shell: bash
        run: |
          TITLE_FILE="src/config/report-title.txt"

          if [ -f "$TITLE_FILE" ]; then
            REPORT_TITLE=$(tr -d '\r\n' < "$TITLE_FILE")
          else
            REPORT_TITLE="$DEFAULT_REPORT_TITLE"
          fi

          if [ -z "$REPORT_TITLE" ]; then
            REPORT_TITLE="$DEFAULT_REPORT_TITLE"
          fi

          echo "REPORT_TITLE=$REPORT_TITLE" >> "$GITHUB_ENV"
          echo "Report title: $REPORT_TITLE"

      - name: Generate HTML report
        shell: bash
        run: |
          mkdir -p artifacts/web-report
          cp reports/pipeline-report.html artifacts/web-report/index.html

          sed -i "s|__REPORT_TITLE__|$REPORT_TITLE|g" artifacts/web-report/index.html
          sed -i "s|__APP_NAME__|$APP_NAME|g" artifacts/web-report/index.html
          sed -i "s|__BUILD_NUMBER__|${{ github.run_number }}|g" artifacts/web-report/index.html
          sed -i "s|__BRANCH__|${{ github.ref_name }}|g" artifacts/web-report/index.html
          sed -i "s|__COMMIT__|${{ github.sha }}|g" artifacts/web-report/index.html

      - name: Upload HTML report artifact
        uses: actions/upload-artifact@v4
        with:
          name: overview-report
          path: artifacts/web-report
          if-no-files-found: error

      - name: Package artifact
        shell: bash
        run: |
          zip -r artifacts/app.zip . -x ".git/*" "node_modules/*" "artifacts/*"

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: drop
          path: artifacts/app.zip
          if-no-files-found: error

      - name: Publish run summary
        shell: bash
        run: |
          {
            echo "# Overview"
            echo ""
            echo "- Reporte: **$REPORT_TITLE**"
            echo "- Repositorio: **${{ github.repository }}**"
            echo "- Workflow: **${{ github.workflow }}**"
            echo "- Ejecucion: **${{ github.run_number }}**"
            echo "- Rama: **${{ github.ref }}**"
            echo "- Commit: **${{ github.sha }}**"
            echo ""
            echo "## Artefactos publicados"
            echo "- **overview-report**: contiene index.html del reporte"
            echo "- **drop**: contiene app.zip"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy_dev:
    name: CD Deploy to dev
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: dev
    steps:
      - name: Deploy dev
        run: echo "Desplegando a Desarrollo..."

  deploy_qa:
    name: CD Deploy to QA
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/heads/release/')
    environment: qa
    steps:
      - name: Deploy qa
        run: echo "Desplegando a Pruebas..."

  change_management:
    name: CD Change management
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: change-management
    steps:
      - name: Change management
        run: echo "Ejecutando gestion del cambio..."

  functional_tests:
    name: CQ Functional tests
    runs-on: ubuntu-latest
    needs: deploy_qa
    if: needs.deploy_qa.result == 'success'
    steps:
      - name: Functional tests
        run: echo "Ejecutando pruebas funcionales..."

  non_functional_tests:
    name: CQ Non-functional tests
    runs-on: ubuntu-latest
    needs: deploy_qa
    if: needs.deploy_qa.result == 'success'
    steps:
      - name: Non-functional tests
        run: echo "Ejecutando pruebas no funcionales..."

  dynamic_security_tests:
    name: CQ Dynamic security tests
    runs-on: ubuntu-latest
    needs: deploy_qa
    if: needs.deploy_qa.result == 'success'
    steps:
      - name: DAST
        run: echo "Ejecutando DAST..."

  deploy_prod:
    name: CD Deploy to production
    runs-on: ubuntu-latest
    needs: change_management
    if: needs.change_management.result == 'success'
    environment: prod
    steps:
      - name: Delay 1 minute
        run: |
          echo "Esperando 1 minuto antes del despliegue..."
          sleep 60

      - name: Deploy prod
        run: echo "Desplegando a Produccion..."

  pir_tests:
    name: CQ PIR tests
    runs-on: ubuntu-latest
    needs: deploy_prod
    if: needs.deploy_prod.result == 'success'
    steps:
      - name: PIR tests
        run: echo "Ejecutando pruebas PIR..."
